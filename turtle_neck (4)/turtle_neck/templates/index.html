<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>거북목 실시간 측정 결과</title>
    <style>
        table { width : 80%; border-collapse : collapse; margin : 20px auto; text-align : center; }
        th, td { border : 1px solid #ccc; padding : 10px; }
        th { background-color : #f4f4f4; }
        .위험 { color : red; font-weight : bold; }
        .경고 { color : orange; font-weight : bold; }
        .정상 { color : green; font-weight : bold; }
    </style>
</head>
<body>
    <h2 style="text-align: center;">실시간 거북목 측정 결과 목록</h2>
    <table>
        <thead>
            <tr>
                <th>번호</th>
                <th>측정 시간</th>
                <th>악화율 (%)</th>
                <th>상태</th>
            </tr>
        </thead>
        <tbody id="result-table">
        </tbody>
    </table>

    <script>
        function fetchResults() {
            fetch('/api/results')
                .then(response => response.json())
                .then(data => {
                    const tbody = document.getElementById('result-table');
                    tbody.replaceChildren();

                    data.forEach(row => {
                        const tr = tbody.insertRow();
                        [row.id, row.timestamp, row.angle, row.status].forEach(v => {
                            tr.insertCell().textContent = v;
                        });
                        tr.cells[3].className = row.status;
                    });
                })
                .catch(error => console.error('Error fetching data:', error));
        }

        setInterval(fetchResults, 2000);
        fetchResults();
    </script>
</body>
</html>
